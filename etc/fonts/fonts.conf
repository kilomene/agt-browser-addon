<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<description>AGT Browser font configuration</description>
	<dir>/data/data/com.novainc.agt/files/addons/agt-browser/share/fonts</dir>
	<dir>/data/data/com.novainc.agt/files/addons/xfce/share/fonts</dir>
	<dir>/data/data/com.novainc.agt/files/usr/share/fonts</dir>
	<cachedir>/data/data/com.novainc.agt/files/addons/agt-browser/var/fontconfig-cache</cachedir>
	<include ignore_missing="yes">/data/data/com.novainc.agt/files/addons/agt-browser/etc/fonts/conf.d</include>
	<alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
	<alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
	<alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
